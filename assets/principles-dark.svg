<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="236" viewBox="0 0 1000 236" role="img" aria-labelledby="t d" fill="none"><title id="t">How I work</title><desc id="d">Start from the workflow, not the model. I map where the information actually lives and who needs it, then decide what the LLM should do. Most of the value is in the plumbing around it. Ship the thin slice first. One working path end to end, in production, early. It surfaces the real problems while they are still cheap to fix. Automate the boring parts. If a task is done by hand more than twice a week, it becomes a workflow. That is where most of the 70% reduction in manual operations came from.</desc><style>@font-face{font-family:GM;src:url(data:font/woff2;base64,) format('woff2');font-weight:400;font-style:normal;}.f-mono{font-family:GM,ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-weight:400;font-style:normal;}@font-face{font-family:G;src:url(data:font/woff2;base64,) format('woff2');font-weight:400;font-style:normal;}.f-sans{font-family:G,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:400;font-style:normal;}@font-face{font-family:GS;src:url(data:font/woff2;base64,) format('woff2');font-weight:600;font-style:normal;}.f-semi{font-family:GS,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:600;font-style:normal;}@font-face{font-family:IS;src:url(data:font/woff2;base64,) format('woff2');font-weight:400;font-style:italic;}.f-serif{font-family:IS,Georgia,'Times New Roman',serif;font-weight:400;font-style:italic;}text{font-kerning:normal;}@media (prefers-reduced-motion:reduce){*{animation:none!important;}.motion{display:none!important;}}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.up{animation:up .7s cubic-bezier(.2,.8,.2,1) both}</style><defs><clipPath id="clip1"><rect x="0.5" y="0.5" width="999" height="235" rx="22"/></clipPath><pattern id="grid2" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" stroke="rgba(255,255,255,0.045)" stroke-width="1"/></pattern><linearGradient id="fade3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0.15"/></linearGradient><mask id="mask4"><rect width="1000" height="236" fill="url(#fade3)"/></mask></defs><rect x="0.5" y="0.5" width="999" height="235" rx="22" fill="#08080a"/><g clip-path="url(#clip1)"><rect width="1000" height="236" fill="url(#grid2)" mask="url(#mask4)"/></g><rect x="0.5" y="0.5" width="999" height="235" rx="22" stroke="rgba(255,255,255,0.17)"/><g class="up" style="animation-delay:0.15s"><text x="28" y="44" class="f-mono" font-size="10.5" fill="#c6f432" letter-spacing="0.63">RULE 01</text><text x="28" y="80" font-size="23" letter-spacing="-0.46" xml:space="preserve"><tspan class="f-semi" fill="#f3f3ee">Start from the workflow,</tspan></text><text x="28" y="107" font-size="23" letter-spacing="-0.46" xml:space="preserve"><tspan class="f-serif" fill="#f3f3ee">not the model</tspan></text><text x="28" y="142" class="f-sans" font-size="14" fill="#b6b6bb">I map where the information actually lives</text><text x="28" y="163" class="f-sans" font-size="14" fill="#b6b6bb">and who needs it, then decide what the</text><text x="28" y="184" class="f-sans" font-size="14" fill="#b6b6bb">LLM should do. Most of the value is in the</text><text x="28" y="205" class="f-sans" font-size="14" fill="#b6b6bb">plumbing around it.</text></g><path d="M333.33 24V212" stroke="rgba(255,255,255,0.08)"/><g class="up" style="animation-delay:0.30s"><text x="361.33" y="44" class="f-mono" font-size="10.5" fill="#c6f432" letter-spacing="0.63">RULE 02</text><text x="361.33" y="80" font-size="23" letter-spacing="-0.46" xml:space="preserve"><tspan class="f-semi" fill="#f3f3ee">Ship the</tspan><tspan class="f-serif" fill="#f3f3ee"> thin slice first</tspan></text><text x="361.33" y="115" class="f-sans" font-size="14" fill="#b6b6bb">One working path end to end, in</text><text x="361.33" y="136" class="f-sans" font-size="14" fill="#b6b6bb">production, early. It surfaces the real</text><text x="361.33" y="157" class="f-sans" font-size="14" fill="#b6b6bb">problems while they are still cheap to fix.</text></g><path d="M666.67 24V212" stroke="rgba(255,255,255,0.08)"/><g class="up" style="animation-delay:0.45s"><text x="694.67" y="44" class="f-mono" font-size="10.5" fill="#c6f432" letter-spacing="0.63">RULE 03</text><text x="694.67" y="80" font-size="23" letter-spacing="-0.46" xml:space="preserve"><tspan class="f-semi" fill="#f3f3ee">Automate the</tspan><tspan class="f-serif" fill="#f3f3ee"> boring parts</tspan></text><text x="694.67" y="115" class="f-sans" font-size="14" fill="#b6b6bb">If a task is done by hand more than twice</text><text x="694.67" y="136" class="f-sans" font-size="14" fill="#b6b6bb">a week, it becomes a workflow. That is</text><text x="694.67" y="157" class="f-sans" font-size="14" fill="#b6b6bb">where most of the 70% reduction in</text><text x="694.67" y="178" class="f-sans" font-size="14" fill="#b6b6bb">manual operations came from.</text></g></svg>
